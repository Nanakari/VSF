name: Bug report
description: Report a reproducible problem with VTuber Song Finder
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove API keys, local database files, logs with private data, and personal channel information before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python/Node versions, and whether this is source mode or the portable package.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste sanitized output only. Do not attach .env, SQLite files, or secrets.
      render: text
