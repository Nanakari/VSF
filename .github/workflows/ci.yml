name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5
      - name: Check repository hygiene
        shell: bash
        run: |
          test ! -e .env
          test ! -e vtuber_songs.sqlite3
          test ! -e VTuberSongFinder.exe
          test ! -e VTuberSongFinderSetup.exe
          test ! -e start.bat
          test ! -e stop.bat
          test ! -e stop.ps1
          git diff --check
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Import application modules
        run: python -c "import app, config, database, indexer_app, main, search, song_identity, timeline_parser, youtube_client"
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check installed Python dependencies
        run: python -m pip check
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Check generated migrations
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle
      - name: Build and validate Worker site
        run: |
          npm run build
          npm run validate
          npm test
