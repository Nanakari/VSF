<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VTuber Song Finder Setup</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>VTuber Song Finder Setup</h1>
          <p class="subtle">创建或更新本地频道歌曲数据库</p>
        </div>        <div class="header-actions">
          <a class="secondary-button button-link" href="{{ search_url }}">检索</a>
          <button id="exit-button" class="secondary-button" type="button">退出</button>
        </div>
      </header>

      <form id="index-form" class="setup-panel" method="post" action="{{ url_for('start_index') }}">
        <label>
          <span>YouTube Data API Key</span>
          <input name="api_key" type="password" autocomplete="off" placeholder="{% if has_saved_api_key %}已保存，留空沿用当前配置{% else %}AIza...{% endif %}">
        </label>
        <label>
          <span>频道 URL / Handle / Channel ID</span>
          <input name="channel" placeholder="https://www.youtube.com/@Shairu.ch_0801">
        </label>
        <div class="setup-grid">
          <label>
            <span>扫描上传数</span>
            <input name="max_videos" type="number" min="1" value="{{ default_max_videos }}">
          </label>
          <label>
            <span>每个视频评论数</span>
            <input name="max_comments" type="number" min="1" value="{{ default_max_comments }}">
          </label>
        </div>
        <label>
          <span>索引模式</span>
          <select name="mode">
            <option value="incremental" selected>增量更新：扫描最新上传，失败条目自动重试</option>
            <option value="backfill">历史回填：从上次中断位置继续</option>
            <option value="full">扫描最新上传：只跳过已完成条目</option>
          </select>
        </label>
        <div class="check-row">
          <label>
            <input name="include_all" type="checkbox">
            <span>不按歌回标题过滤</span>
          </label>
          <label>
            <input name="reset_backfill" type="checkbox">
            <span>重置历史回填进度</span>
          </label>
        </div>
        <button id="start-button" type="submit">开始索引</button>
      </form>

      <section class="setup-status" aria-live="polite">
        <div class="status-line">
          <strong id="status-message">等待开始索引。</strong>
        </div>
        <dl class="setup-stats">
          <div><dt>已扫描视频</dt><dd id="videos-seen">0</dd></div>
          <div><dt>已索引视频</dt><dd id="videos-indexed">0</dd></div>
          <div><dt>跳过视频</dt><dd id="videos-skipped">0</dd></div>
          <div><dt>失败待重试</dt><dd id="videos-failed">0</dd></div>
          <div><dt>扫描评论</dt><dd id="comments-seen">0</dd></div>
          <div><dt>时间轴评论</dt><dd id="timeline-comments">0</dd></div>
          <div><dt>新增时间点</dt><dd id="entries-inserted">0</dd></div>
        </dl>
        <pre id="job-log" class="job-log"></pre>
      </section>
    </main>

    <script>
      (() => {
        const form = document.querySelector("#index-form");
        const button = document.querySelector("#start-button");
        const exitButton = document.querySelector("#exit-button");
        const message = document.querySelector("#status-message");
        const log = document.querySelector("#job-log");
        let formError = "";
        const statMap = {
          videos_seen: document.querySelector("#videos-seen"),
          videos_indexed: document.querySelector("#videos-indexed"),
          videos_skipped: document.querySelector("#videos-skipped"),
          videos_failed: document.querySelector("#videos-failed"),
          comments_seen: document.querySelector("#comments-seen"),
          timeline_comments: document.querySelector("#timeline-comments"),
          entries_inserted: document.querySelector("#entries-inserted")
        };

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          formError = "";
          button.disabled = true;
          message.textContent = "正在启动索引任务...";
          try {
            const response = await fetch(form.action, {
              method: "POST",
              body: new FormData(form)
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              formError = data.message || "启动失败。";
              button.disabled = false;
              message.textContent = formError;
              return;
            }
            message.textContent = data.message || "索引任务已开始。";
          } catch (_) {
            formError = "无法连接更新服务，请重新打开更新页面。";
            button.disabled = false;
            message.textContent = formError;
          }
        });

        exitButton.addEventListener("click", async () => {
          exitButton.disabled = true;
          message.textContent = "正在退出...";
          const shutdownUrl = "{{ url_for('shutdown') }}";
          const closeUrl = "{{ url_for('shutdown_close') }}";
          try {
            const response = await fetch(shutdownUrl, { method: "POST" });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              message.textContent = data.message || "索引任务正在运行，暂时不能退出。";
              exitButton.disabled = false;
              return;
            }
          } catch (_) {
            message.textContent = "无法确认索引服务状态，请不要关闭窗口，稍后重试。";
            exitButton.disabled = false;
            return;
          }
          window.open("", "_self");
          window.close();
          setTimeout(() => { window.location.href = closeUrl; }, 300);
        });
        const refreshStatus = async () => {
          const response = await fetch("{{ url_for('status') }}");
          const data = await response.json();
          if (!formError) {
            message.textContent = data.message || "";
          }
          const stats = data.stats || {};
          Object.entries(statMap).forEach(([key, element]) => {
            element.textContent = String(stats[key] || 0);
          });
          log.textContent = (data.log || []).join("\n");
          log.scrollTop = log.scrollHeight;
          button.disabled = Boolean(data.running);
        };

        window.setInterval(refreshStatus, 1500);
        refreshStatus();

        {% if auto_exit_enabled %}
          const clientId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
          const payload = () => JSON.stringify({ client_id: clientId });
          const post = (url) => {
            try {
              navigator.sendBeacon(url, new Blob([payload()], { type: "application/json" }));
            } catch {
              fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: payload(),
                keepalive: true
              }).catch(() => {});
            }
          };
          post("{{ url_for('client_ping') }}");
          const intervalId = window.setInterval(() => post("{{ url_for('client_ping') }}"), 5000);
          window.addEventListener("pagehide", (event) => {
            window.clearInterval(intervalId);
            if (event.persisted) {
              return;
            }
            post("{{ url_for('client_close') }}");
          });
        {% endif %}
      })();
    </script>
  </body>
</html>
